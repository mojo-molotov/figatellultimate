name: Load test

# The example with 2,500 generated posts per locale: build and typecheck times, the JavaScript and HTML of the
# key pages, the bytes a navigation moves in Chromium, against budgets. Weekly and on demand, never on each pull request.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      posts:
        description: Generated posts per locale
        default: '2500'

permissions:
  contents: read

jobs:
  load:
    name: Load test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The example consumes the packages as a user would: built.
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium-headless-shell
      - run: pnpm --filter figatellultimate-example-next example:load --posts ${{ inputs.posts || '2500' }}
      - if: always()
        run: cat .tmp/load-*/load-report.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-report
          path: .tmp/load-*/load-report.md
          # The report lives under a hidden folder, which upload-artifact leaves out by default.
          include-hidden-files: true

  # The load report, published under /load/ next to the test reports, as a page (see the reports-publish action).
  report:
    name: Publish the report
    needs: load
    if: always() && github.repository_visibility != 'private'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Shared by every workflow that publishes a report: one publication at a time, none cancelled.
    concurrency:
      group: allure-reports
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      # The page and the index are written by plain Node: no install.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/download-artifact@v8
        with:
          name: load-report
          path: load-report
      - id: report
        run: echo "path=$(find load-report -name load-report.md | head -1)" >> "$GITHUB_OUTPUT"
      - if: steps.report.outputs.path != ''
        uses: ./.github/actions/reports-publish
        with:
          family: load
          title: Load test (weekly)
          frequency: weekly
          markdown: ${{ steps.report.outputs.path }}
      - if: steps.report.outputs.path != ''
        id: deployment
        uses: actions/deploy-pages@v5
