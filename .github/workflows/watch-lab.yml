name: Watch lab

# Slow, timing-dependent suites: weekly and on demand, on every OS, never on each pull request.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    name: Watch lab (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:lab
      - name: Upload the Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-lab-${{ matrix.os }}
          path: allure-results/
          retention-days: 1

  # This workflow's Allure report, published under /watch-lab/ next to the others (see the reports-publish action).
  report:
    name: Publish the report
    needs: lab
    if: always() && github.repository_visibility != 'private'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: allure-reports
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: allure-results-lab-*
          path: allure-results
          merge-multiple: true
      - uses: ./.github/actions/reports-publish
        with:
          family: watch-lab
          title: Watch lab (weekly)
      - id: deployment
        uses: actions/deploy-pages@v5
