name: Browsers

# The component tests replayed in Chromium, Firefox and WebKit: real layout, focus and keyboard.
# Weekly and on demand, never on each pull request (happy-dom runs the same files there).
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browsers:
    name: Browsers (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    # Playwright's own image: the browsers and their system packages already installed (installing them took from
    # one to eleven minutes, Ubuntu's mirror being slow), pinned by digest, the release of the repository's playwright.
    # Firefox refuses to run as root: the runner's user (1001), who owns the workspace; Chromium needs --ipc=host.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:browser
      - name: Upload the Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-browsers
          path: allure-results/
          retention-days: 1

  # This workflow's Allure report, published under /browsers/ next to the others (see the reports-publish action).
  report:
    name: Publish the report
    needs: browsers
    if: always() && github.repository_visibility != 'private'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: allure-reports
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          pattern: allure-results-browsers
          path: allure-results
          merge-multiple: true
      - id: deployment
        uses: ./.github/actions/reports-publish
        with:
          family: browsers
          title: Real browsers (weekly)
          frequency: weekly
