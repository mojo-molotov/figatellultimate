name: Example app

# The example app's real `next build`: every route and its metadata, by configuration only.
# Weekly and on demand, on every OS, never on each pull request.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  example:
    name: Example app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # On Linux, Playwright's own image (see browsers.yml): containers exist on Linux runners only, so Windows installs
    # its browser, which needs no system package there.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            container:
              image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
              options: --ipc=host --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The example consumes the packages as a user would: built.
      # Builds the packages it uses first, then the app.
      - run: pnpm --filter figatellultimate-example-next example:build
      - run: pnpm --filter figatellultimate-example-next example:verify
      # What only a browser and Next's router show: the screen still on a list's next page, filters applied.
      - if: runner.os != 'Linux'
        run: pnpm --filter figatellultimate-example-next exec playwright install chromium-headless-shell
      - run: pnpm --filter figatellultimate-example-next example:browse
