# Dependabot keeps the dependencies up to date, weekly, each update a Conventional commit (commitlint): the packages,
# through pnpm's lockfile at the root, and the actions, the composite ones included, pinned by commit SHA with their
# version beside it, which Dependabot updates together. Checked by tooling/__tests__/github-actions.test.ts.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Playwright 1.65's Chromium (159) crashes the renderer on a view transition in an iframe, where vitest runs the
      # browser tests, once a named element has a child running a CSS animation (the theme toggle's orbit); 1.64's
      # Chromium (156) and Chrome 158 do not. Lifted once a Playwright release ships a Chromium that does not crash.
      - dependency-name: playwright
        versions: ['1.65.x']

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
