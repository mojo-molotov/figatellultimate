name: Publish a test report
description: >-
  Renders one test family's report (an Allure report from its results, or a Markdown report as a page) into its own
  folder of the allure-reports branch, with its own history and metadata, writes the index of every report
  (tooling/reports-index.ts), and pushes the branch, which GitHub Pages serves. Each family replaces only its folder,
  so the CI's report and the weekly ones never overwrite each other. Each family publishes on its own (a concurrency
  group per family, `allure-reports-<family>`): the branch is read again at the push, the report laid over it, and
  pushed only if nobody pushed since, else read again.
  The branch stays under GitHub's 100 MB file limit and never grows: each history is compressed and holds its last
  runs (allurerc.mjs's historyLimit), a file near the limit fails the publication with a clear message, and the
  branch is one commit, replaced on each publication (its history is the trends', in the files, not git's).
  GitHub Pages serves the branch itself (its source, deployed on each push): the publication is the push, tried again
  after a pause when GitHub refuses it; the caller's job needs `contents: write` only. Rejected: a pages artifact
  deployed by the job, whose lookup of the artifact lagged its upload and failed.

inputs:
  family:
    description: The report's folder and history name, e.g. ci, browsers, watch-lab
    required: true
  title:
    description: The report's name (its page's title, and the index's when it has no metadata)
    required: true
  frequency:
    description: How often it runs, in a word, shown by the index (push, weekly)
    required: true
  results-dir:
    description: The merged allure-results of the family's jobs (an Allure report)
    default: allure-results
  markdown:
    description: A Markdown report published as the family's page instead of an Allure report (the load test's)
    default: ''
  extra-dir:
    description: A folder published inside the report's, as <family>/<extra-name> (e.g. the coverage)
    default: ''
  extra-name:
    description: The extra folder's name
    default: ''

runs:
  using: composite
  steps:
    - name: Check out the reports branch
      shell: bash
      run: |
        rm -rf .allure-reports
        remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
        if ! git clone -q --depth=1 --branch allure-reports "$remote" .allure-reports 2>/dev/null; then
          mkdir .allure-reports
          git -C .allure-reports init -q
          git -C .allure-reports checkout -q --orphan allure-reports
          git -C .allure-reports remote add origin "$remote"
        fi
        mkdir -p .allure-reports/_history
        # Uncompressed histories are an older format, dropped: each family's history restarts compressed.
        rm -f .allure-reports/_history/*.jsonl

    - name: Render the Allure report with its own history
      if: inputs.markdown == ''
      shell: bash
      run: |
        family="${{ inputs.family }}"
        history=".allure-reports/_history/$family.jsonl.gz"
        rm -rf history.jsonl allure-report ".allure-reports/$family"
        if [ -f "$history" ]; then gunzip -c "$history" > history.jsonl; fi
        pnpm exec allure generate "${{ inputs.results-dir }}" --output allure-report
        mv allure-report ".allure-reports/$family"
        coverage=()
        if [ -n "${{ inputs.extra-dir }}" ] && [ -d "${{ inputs.extra-dir }}" ]; then
          cp -R "${{ inputs.extra-dir }}" ".allure-reports/$family/${{ inputs.extra-name }}"
          # The coverage's share of lines, shown by the index and linked to its report.
          if [ -f "${{ inputs.extra-dir }}/coverage-summary.json" ]; then
            coverage=(--coverage "${{ inputs.extra-dir }}/coverage-summary.json")
          fi
        fi
        node tooling/reports-index.ts meta --site .allure-reports --family "$family" --title "${{ inputs.title }}" \
          --frequency "${{ inputs.frequency }}" --report ".allure-reports/$family" "${coverage[@]}"
        if [ -f history.jsonl ]; then gzip -9 -c history.jsonl > "$history"; fi

    - name: Render the Markdown report as a page
      if: inputs.markdown != ''
      shell: bash
      run: |
        family="${{ inputs.family }}"
        # Its folder kept: the page keeps the last five runs under runs/<run number>/, the newest at its root.
        node tooling/reports-index.ts page --markdown "${{ inputs.markdown }}" --title "${{ inputs.title }}" \
          --dir ".allure-reports/$family" --keep 5
        node tooling/reports-index.ts meta --site .allure-reports --family "$family" --title "${{ inputs.title }}" \
          --frequency "${{ inputs.frequency }}" --markdown "${{ inputs.markdown }}"

    - name: Set the report aside
      shell: bash
      run: |
        # The publication's own files: its folder and its history's (`_history/<family>.*`), laid over the branch as
        # it stands when pushed.
        family="${{ inputs.family }}"
        rm -rf .publication
        mkdir -p .publication/_history
        cp -R ".allure-reports/$family" ".publication/$family"
        for own in .allure-reports/_history/"$family".*; do
          if [ -e "$own" ]; then cp "$own" .publication/_history/; fi
        done

    - name: Publish the reports branch
      shell: bash
      run: |
        family="${{ inputs.family }}"
        remote="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
        # One attempt: the branch as it stands, the report laid over it, the index of every report written again, then
        # one commit replacing the branch (kept commits would hold every version of every history), pushed only if the
        # branch is still the one read (`--force-with-lease`): another family may have pushed meanwhile.
        publish() {
          rm -rf .allure-reports
          if git clone -q --depth=1 --branch allure-reports "$remote" .allure-reports 2>/dev/null; then
            base=$(git -C .allure-reports rev-parse HEAD)
          else
            mkdir .allure-reports
            base=''
          fi
          rm -rf .allure-reports/.git ".allure-reports/$family"
          mkdir -p .allure-reports/_history
          # Uncompressed histories are an older format, dropped: each family's history restarts compressed.
          rm -f .allure-reports/_history/*.jsonl
          cp -R .publication/. .allure-reports/
          node tooling/reports-index.ts index --site .allure-reports
          touch .allure-reports/.nojekyll
          # GitHub refuses a file over 100 MB, with no hint of which report grew: say it here, with room to spare.
          large=$(find .allure-reports -type f -size +90M -print)
          if [ -n "$large" ]; then
            echo "::error::Over 90 MB, near GitHub's 100 MB limit (lower historyLimit in allurerc.mjs): $large"
            exit 1
          fi
          (
            cd .allure-reports
            git init -q
            git checkout -q --orphan allure-reports
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "chore: reports, $family last (run #${{ github.run_number }})"
            git push -q --force-with-lease="allure-reports:$base" "$remote" allure-reports
          )
        }
        # Refused, by that race or on GitHub's side (`fatal error in commit_refs_rules`): read again after a pause.
        for pause in 15 30 60; do
          if publish; then exit 0; fi
          sleep "$pause"
        done
        publish
