packages:
  - packages/*
  - examples/*

# Dependency build scripts, reviewed one by one (supply chain): none is allowed to run.
# - esbuild (via Content Collections): its postinstall only checks its binary, which pnpm already installs
#   through the platform-specific optional dependencies.
# - @parcel/watcher and @swc/core (via next-intl, example only): used by next-intl's message extractor, which the
#   example does not run; both also ship prebuilt binaries.
allowBuilds:
  esbuild: false
  '@parcel/watcher': false
  '@swc/core': false
